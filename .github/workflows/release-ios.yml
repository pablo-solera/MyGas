name: Release iOS (experimental)

# Never run so far: there is no macOS machine to test it on. Review before relying on it.
# Required secrets: IOS_TEAM_ID, APPSTORE_KEY_ID, APPSTORE_ISSUER_ID and APPSTORE_API_KEY_P8 (the .p8 contents).
# Signing uses automatic provisioning through the App Store Connect API key.
on:
  workflow_dispatch:
    inputs:
      version-name:
        description: Marketing version (for example 1.0.0)
        required: true
      upload:
        description: Upload the build to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      KEY_PATH: ${{ github.workspace }}/AuthKey.p8
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ./.github/actions/setup-build
        with:
          jvm-heap: 6g

      - name: Write the API key and the signing settings
        run: |
          echo "${{ secrets.APPSTORE_API_KEY_P8 }}" > "$KEY_PATH"
          sed -i '' "s/^TEAM_ID=.*/TEAM_ID=${{ secrets.IOS_TEAM_ID }}/" iosApp/Configuration/Config.xcconfig
          sed -i '' "s/^MARKETING_VERSION=.*/MARKETING_VERSION=${{ inputs.version-name }}/" iosApp/Configuration/Config.xcconfig
          sed -i '' "s/^CURRENT_PROJECT_VERSION=.*/CURRENT_PROJECT_VERSION=${{ github.run_number }}/" iosApp/Configuration/Config.xcconfig

      - name: Archive
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MyGas.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}"

      - name: Export the IPA
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MyGas.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload to TestFlight
        if: inputs.upload
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$KEY_PATH" ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

      - name: Remove the API key
        if: always()
        run: rm -f "$KEY_PATH" ~/.appstoreconnect/private_keys/*.p8
