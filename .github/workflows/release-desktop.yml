name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: packageDeb
            pattern: "desktopApp/build/compose/binaries/main/deb/*.deb"
          - os: windows-latest
            task: packageMsi
            pattern: "desktopApp/build/compose/binaries/main/msi/*.msi"
          - os: macos-latest
            task: packageDmg
            pattern: "desktopApp/build/compose/binaries/main/dmg/*.dmg"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      - name: Tests
        run: ./gradlew :shared:desktopTest

      - name: Package
        run: ./gradlew :desktopApp:${{ matrix.task }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.pattern }}

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.pattern }}
