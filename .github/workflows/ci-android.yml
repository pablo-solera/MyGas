name: CI Android

on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The map key is only needed for release builds; a dummy value validates the R8 pipeline.
      MAPS_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      - name: Unit tests
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Lint
        run: ./gradlew :androidApp:lintDebug

      - name: Debug and release (R8) builds
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            androidApp/build/reports/lint-results-debug.*
            shared/build/reports/tests
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7
